[project]
name = "buildagents"
version = "0.2.0"

description = "Production-ready scaffolder for Agentic AI applications"
authors = [{ name = "Prem Sai Varma", email = "premsaivarma.chekuri@gmail.com" }]
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "jinja2>=3.1.0",
]

[project.scripts]
buildagents = "buildagents.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildagents"]

[project.urls]
Homepage = "https://github.com/premsaivarmachekuri/BuildAgents"
Repository = "https://github.com/premsaivarmachekuri/BuildAgents"